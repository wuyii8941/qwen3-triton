[project]
name = "qwen3-triton"
version = "0.1.0"
description = "Qwen3-8B Triton training and inference runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.6",
    "transformers==4.51.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["artifacts", ".venv*", ".runtime*"]
